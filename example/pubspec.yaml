name: reorderable_tabbar_example
description: Demonstrates reorderable tabs with the standalone Material UI library.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^2.0.0
  material_ui: ^1.7.0
  reorderable_tabbar:
    path: ../

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
